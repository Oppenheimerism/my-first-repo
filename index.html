<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Voxel Mt. Fuji</title>
<style>
  body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; }
  #info {
    position: absolute; top: 10px; left: 10px;
    color: white; background: rgba(0,0,0,0.4);
    padding: 8px 12px; border-radius: 6px;
    font-size: 14px; user-select: none;
  }
</style>
</head>
<body>
<div id="info">Voxel Mt. Fuji — drag to rotate, scroll to zoom</div>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);
scene.fog = new THREE.Fog(0x87ceeb, 60, 200);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 500);
camera.position.set(50, 35, 60);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.6));
const sun = new THREE.DirectionalLight(0xffffff, 0.9);
sun.position.set(40, 60, 30);
scene.add(sun);

const cube = new THREE.BoxGeometry(1, 1, 1);
const matRock = new THREE.MeshLambertMaterial({ color: 0x6b5d4f });
const matSnow = new THREE.MeshLambertMaterial({ color: 0xffffff });
const matGrass = new THREE.MeshLambertMaterial({ color: 0x4a8b3a });

// Build Mt. Fuji as a stepped pyramid
const mountainHeight = 24;
const baseRadius = 22;
const group = new THREE.Group();

for (let y = 0; y < mountainHeight; y++) {
  const radius = baseRadius * (1 - y / mountainHeight);
  for (let x = -radius; x <= radius; x++) {
    for (let z = -radius; z <= radius; z++) {
      const dist = Math.sqrt(x * x + z * z);
      if (dist <= radius) {
        const isSnow = y > mountainHeight * 0.7;
        const block = new THREE.Mesh(cube, isSnow ? matSnow : matRock);
        block.position.set(x, y, z);
        group.add(block);
      }
    }
  }
}

// Grass ground
for (let x = -40; x <= 40; x++) {
  for (let z = -40; z <= 40; z++) {
    const dist = Math.sqrt(x * x + z * z);
    if (dist > baseRadius - 1) {
      const block = new THREE.Mesh(cube, matGrass);
      block.position.set(x, -1, z);
      group.add(block);
    }
  }
}

scene.add(group);

// Voxel Godzilla stomping near the base
const matBody = new THREE.MeshLambertMaterial({ color: 0x2d5016 });
const matBelly = new THREE.MeshLambertMaterial({ color: 0x6b8e3d });
const matSpike = new THREE.MeshLambertMaterial({ color: 0x4a3a6b });
const matEye = new THREE.MeshLambertMaterial({ color: 0xff2200 });

const godzilla = new THREE.Group();
const put = (x, y, z, mat) => {
  const b = new THREE.Mesh(cube, mat);
  b.position.set(x, y, z);
  godzilla.add(b);
};

// Legs
for (let y = 0; y < 4; y++) { put(0, y, 0, matBody); put(2, y, 0, matBody); }
// Torso
for (let y = 4; y < 9; y++) for (let x = 0; x <= 2; x++) for (let z = 0; z <= 1; z++) {
  put(x, y, z, (x === 1 && z === 1) ? matBelly : matBody);
}
// Arms
for (let y = 6; y < 8; y++) { put(-1, y, 0, matBody); put(3, y, 0, matBody); }
// Neck + head
put(1, 9, 0, matBody);
for (let y = 10; y < 13; y++) for (let x = 0; x <= 2; x++) for (let z = 0; z <= 1; z++) {
  put(x, y, z, matBody);
}
// Snout
put(1, 11, -1, matBody); put(1, 11, -2, matBody);
// Eyes
put(0, 12, -1, matEye); put(2, 12, -1, matEye);
// Back spikes
for (let y = 5; y < 11; y++) put(1, y, 2, matSpike);
// Tail
put(1, 4, 2, matBody); put(1, 4, 3, matBody); put(1, 5, 4, matBody); put(1, 6, 5, matBody);

godzilla.position.set(26, 0, -3);
godzilla.rotation.y = -Math.PI / 4;
scene.add(godzilla);

// Voxel UFO hovering above the peak
const matUfoBody = new THREE.MeshLambertMaterial({ color: 0x888888 });
const matUfoDome = new THREE.MeshLambertMaterial({ color: 0x66ccff });
const matUfoLight = new THREE.MeshLambertMaterial({ color: 0xffff00, emissive: 0xffaa00 });
const ufo = new THREE.Group();
const putUfo = (x, y, z, mat) => {
  const b = new THREE.Mesh(cube, mat);
  b.position.set(x, y, z);
  ufo.add(b);
};
// Saucer disk (wider middle ring)
for (let x = -3; x <= 3; x++) for (let z = -3; z <= 3; z++) {
  const d = Math.sqrt(x*x + z*z);
  if (d <= 3) putUfo(x, 0, z, matUfoBody);
}
// Dome on top
for (let x = -1; x <= 1; x++) for (let z = -1; z <= 1; z++) putUfo(x, 1, z, matUfoDome);
putUfo(0, 2, 0, matUfoDome);
// Blinking lights underneath
putUfo(-2, -1, 0, matUfoLight);
putUfo(2, -1, 0, matUfoLight);
putUfo(0, -1, -2, matUfoLight);
putUfo(0, -1, 2, matUfoLight);

ufo.position.set(0, 32, 0);
scene.add(ufo);

// Animate the UFO bobbing
const ufoAnim = ufo;
const startY = ufo.position.y;
function ufoFloat(t) { ufoAnim.position.y = startY + Math.sin(t * 0.001) * 1.5; ufoAnim.rotation.y = t * 0.0005; }

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

function animate(t) {
  requestAnimationFrame(animate);
  ufoFloat(t || 0);
  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
